name: Build and publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Expand initial source upload
        if: hashFiles('source-upload.zip') != ''
        shell: bash
        run: |
          python - <<'PY'
          import zipfile, pathlib
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile('source-upload.zip') as archive:
              for item in archive.infolist():
                  target = (root / item.filename).resolve()
                  if not target.is_relative_to(root) or '.git' in pathlib.Path(item.filename).parts:
                      raise ValueError('Unsafe archive path')
                  if item.filename.startswith('.github/workflows/'):
                      continue
                  archive.extract(item, root)
          PY
          git rm source-upload.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'feat: unpack complete portfolio source [skip ci]'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build static preview
        run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /ehsan-portfolio
          NEXT_PUBLIC_SITE_URL: https://ehsanersan.github.io/ehsan-portfolio
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .next-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
